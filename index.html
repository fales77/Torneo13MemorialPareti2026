<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>13° Memorial Pareti 2026</title>

  <style>
    body {
      font-family: Arial;
      background: #0a1628;
      color: white;
      padding: 20px;
    }

    h1 {
      color: #f5c842;
      text-align: center;
    }

    .giorno-block {
      margin-bottom: 20px;
    }

    .giorno-header {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: #f5c842;
    }

    .partita-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.05);
      padding: 8px 10px;
      margin-bottom: 5px;
      border-radius: 6px;
    }

    .orario {
      font-size: 0.9rem;
      color: #ccc;
      width: 50px;
    }

    .partita-vs {
      flex: 1;
      padding: 0 10px;
    }

    .squadre {
      font-weight: bold;
    }

    .vs-sep {
      margin: 0 5px;
      color: #aaa;
    }

    .partita-giornata {
      display: block;
      font-size: 0.75rem;
      color: #999;
    }

    .risultato-box {
      font-weight: bold;
      font-size: 1rem;
      min-width: 40px;
      text-align: right;
    }
  </style>
</head>

<body>

<h1>Calendario</h1>

<div id="calendario"></div>

<script>
fetch('risultatiCOMPLETO.json')
  .then(res => res.json())
  .then(data => {

    const container = document.getElementById("calendario");
    container.innerHTML = "";

    // ✅ ORDINA per data + ora
    data.sort((a, b) => {
      return new Date(a.data + "T" + a.ora) - new Date(b.data + "T" + b.ora);
    });

    // ✅ RAGGRUPPA PER DATA
    const gruppi = {};

    data.forEach(m => {
      if (!gruppi[m.data]) gruppi[m.data] = [];
      gruppi[m.data].push(m);
    });

    // ✅ CREA BLOCCO PER OGNI GIORNO
    Object.keys(gruppi).forEach(data => {

      const giornoDiv = document.createElement("div");
      giornoDiv.className = "giorno-block";

      const d = new Date(data);
      const dataFormattata = d.toLocaleDateString("it-IT", {
        weekday: "long",
        day: "numeric",
        month: "long"
      });

      giornoDiv.innerHTML = `
        <div class="giorno-header">${dataFormattata}</div>
      `;

      gruppi[data].forEach(m => {

        let risultato = "–";

        if (m.golCasa !== null && m.golTrasferta !== null) {
          risultato = `${m.golCasa}-${m.golTrasferta}`;
        }

        const matchDiv = document.createElement("div");
        matchDiv.className = "partita-card";

        matchDiv.innerHTML = `
          <span class="orario">${m.ora}</span>

          <div class="partita-vs">
            <span class="squadre">
              ${m.casa} <span class="vs-sep">vs</span> ${m.trasferta}
            </span>
            <span class="partita-giornata">${m.giornata}ª giornata</span>
          </div>

          <div class="risultato-box">${risultato}</div>
        `;

        giornoDiv.appendChild(matchDiv);
      });

      container.appendChild(giornoDiv);
    });

  })
  .catch(err => console.error(err));
</script>

</body>
</html>
