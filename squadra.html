<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dettaglio Squadra</title>

<style>
body {
  font-family: Arial;
  background: #0a1628;
  color: white;
  padding: 20px;
}

h1 {
  color: #f5c842;
}

.partita {
  background: rgba(255,255,255,0.05);
  padding: 10px;
  margin: 6px 0;
  border-radius: 6px;
}
/*FRECCIA INDIETRO - TORNA A*/
.back-btn {
  position: fixed;
  top: 15px;
  left: 15px;

  display: flex;
  align-items: center;
  gap: 6px;

  background: #f5c842;
  color: #0a1628;

  padding: 6px 10px;        /* 👈 più compatto */
  border-radius: 6px;

  font-weight: 700;
  text-decoration: none;

  z-index: 1000;
}

/* hover fix (importantissimo) */
.back-btn:hover {
  background: #fde98a;
  color: #0a1628;
  text-decoration: none;
}

/* freccia bella grossa */
.back-btn .arrow {
  font-size: 20px;
  line-height: 1;
}

/* testo un filo più grande */
.back-btn .label {
  font-size: 14px;
}

h1 {
  margin-top: 35px;
}

</style>
</head>

<body>

<a href="javascript:history.back()" class="back-btn">
  <span class="arrow">←</span>
  <span class="label">Torna</span>
</a>


<h1 id="titolo"></h1>

<div id="lista-partite"></div>

<script>
// 🔹 prende nome squadra da URL
const params = new URLSearchParams(window.location.search);
const team = params.get("team");

// 🔹 titolo pagina
document.getElementById("titolo").textContent = team;

// 🔹 carica risultati da JSON
fetch('risultati.json')
  .then(res => res.json())
  .then(data => {

    if (!team) return;

    const container = document.getElementById("lista-partite");
    container.innerHTML = '';

    // 🔹 filtra partite della squadra
    const partite = data.filter(m =>
      m.casa === team || m.trasferta === team
    );

    // 🔹 costruisce lista
    partite.forEach(m => {

      const gC = m.golCasa;
      const gO = m.golTrasferta;

      let risultatoHtml = "Risultato: —";

      if (gC !== null && gO !== null) {

        let colore = "#ffffff";

        // 🔹 squadra gioca in casa
        if (team === m.casa) {
          if (gC > gO) colore = "#2ecc71";     // vittoria → verde
          else if (gC < gO) colore = "#e74c3c"; // sconfitta → rosso
          else colore = "#f5c842";             // pareggio → giallo
        }
        // 🔹 squadra gioca in trasferta
        else {
          if (gO > gC) colore = "#2ecc71";
          else if (gO < gC) colore = "#e74c3c";
          else colore = "#f5c842";
        }

        risultatoHtml = `
          <span style="color:${colore}; font-weight:700;">
            Risultato: ${gC}-${gO}
          </span>
        `;
      }

      // 🔹 crea blocco partita
      const div = document.createElement('div');
      div.className = 'partita';

      div.innerHTML = `
        <strong>${m.casa} vs ${m.trasferta}</strong><br>
        ${risultatoHtml}
      `;

      container.appendChild(div);
    });

  })
  .catch(err => console.error("Errore caricamento JSON:", err));
</script>

</body>
</html>
