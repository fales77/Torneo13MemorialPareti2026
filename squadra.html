<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dettaglio Squadra</title>

<style>
body {
  font-family: Arial;
  background: #0a1628;
  color: white;
  padding: 20px;
}

h1 {
  color: #f5c842;
  font-size: 1.4rem;
  font-weight: bold;
  margin: 0;
}

/* HEADER */
.header-squadra {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 15px;
}

/* BOTTONE BACK */
.back-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  background: #f5c842;
  color: #0a1628;
  padding: 6px 10px;
  border-radius: 6px;
  font-weight: 700;
  text-decoration: none;
  font-size: 0.9rem;
}

.back-btn:hover {
  background: #fde98a;
  color: #0a1628;
}

.back-btn .arrow {
  font-size: 12px;
  line-height: 1;
}

.back-btn .label {
  font-size: 13px;
}

/* PARTITE */
.partita {
  background: rgba(255,255,255,0.05);
  padding: 5px 8px;
  margin: 5px 0;
  border-radius: 6px;
}

/* DATA + ORA */
.match-datetime {
  font-size: 0.72rem;
  color: #999;
  margin: 0;
  padding: 0;
  line-height: 1;        /* 👈 fondamentale */
  transform: translateY(2px);
}

/* STRUTTURA PARTITA */
.match-row {
  display: flex;
  flex-direction: column;
  gap: 0px;
}

.match-main {
  margin: 0;
  padding: 0;
  line-height: 1;        /* 👈 fondamentale */
}

/* elimina eventuali spazi tra elementi inline */
.match-row span,
.match-row strong {
  margin: 0;
  padding: 0;
}


</style>
</head>

<body>
<div class="header-squadra">
  <a href="javascript:history.back()" class="back-btn">
    <span class="arrow">←</span>
    <span class="label">Back</span>
  </a>

  <h1 id="titolo"></h1>
</div>

<div id="lista-partite"></div>

<script>
// 🔹 prende nome squadra da URL
const params = new URLSearchParams(window.location.search);
const team = params.get("team");

// 🔹 titolo pagina
document.getElementById("titolo").textContent = team;

// 🔹 carica anche index.html (calendario)
Promise.all([
  fetch('risultati.json').then(r => r.json()),
  fetch('index.html').then(r => r.text())
])
.then(([risultati, htmlCalendario]) => {

  if (!team) return;

  const parser = new DOMParser();
  const doc = parser.parseFromString(htmlCalendario, "text/html");

  // 🔹 funzione per trovare data e orario
  function trovaInfoPartita(casa, trasferta) {

    const giorni = doc.querySelectorAll(".giorno-block");

    for (let giorno of giorni) {
      const data = giorno.querySelector(".giorno-header")?.innerText;
      const matches = giorno.querySelectorAll(".partita-card");

      for (let match of matches) {
        const c = match.dataset.casa;
        const o = match.dataset.ospite;
        const orario = match.querySelector(".orario")?.innerText;

        if (c === casa && o === trasferta) {
          return { data, orario };
        }
      }
    }

    return { data: "Data da definire", orario: "—" };
  }

  const container = document.getElementById("lista-partite");
  container.innerHTML = '';

  // 🔹 filtra partite della squadra
  const partite = risultati.filter(m =>
    m.casa === team || m.trasferta === team
  );

  // 🔹 ciclo partite
  partite.forEach(m => {

    const info = trovaInfoPartita(m.casa, m.trasferta);

    const gC = m.golCasa;
    const gO = m.golTrasferta;

    let risultato = "—";

    if (gC !== null && gO !== null) {
      risultato = `${gC}-${gO}`;
    }

    // 🔹 colore risultato
    let colore = "#ffffff";

    if (gC !== null && gO !== null) {
      if (team === m.casa) {
        if (gC > gO) colore = "#2ecc71";
        else if (gC < gO) colore = "#e74c3c";
        else colore = "#f5c842";
      } else {
        if (gO > gC) colore = "#2ecc71";
        else if (gO < gC) colore = "#e74c3c";
        else colore = "#f5c842";
      }
    }

    // ✅ FORMATO COME VUOI TU
    const div = document.createElement('div');
    div.className = 'partita';

    div.innerHTML = `
    
<div class="match-row">
    <span class="match-datetime">
      📅 ${info.data} | 🕒 ${info.orario}
    </span>
    <span class="match-main">
      <strong>${m.casa} vs ${m.trasferta}</strong> : 
      <span style="color:${colore}; font-weight:700;">
        ${risultato}
      </span>
    </span>
  </div>
`;

    container.appendChild(div);
  });

})
.catch(err => console.error("Errore:", err));
</script>

</body>
</html>
