<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dettaglio Squadra</title>

<style>
body {
  font-family: Arial;
  background: #0a1628;
  color: white;
  padding: 20px;
}

h1 {
  color: #f5c842;
}

.partita {
  background: rgba(255,255,255,0.05);
  padding: 10px;
  margin: 6px 0;
  border-radius: 6px;
}
/*FRECCIA INDIETRO - TORNA A*/
.back-btn {
  position: fixed;
  top: 15px;
  left: 15px;

  display: flex;
  align-items: center;
  gap: 6px;

  background: #f5c842;
  color: #0a1628;

  padding: 6px 10px;        /* 👈 più compatto */
  border-radius: 6px;

  font-weight: 700;
  text-decoration: none;

  z-index: 1000;
}

/* hover fix (importantissimo) */
.back-btn:hover {
  background: #fde98a;
  color: #0a1628;
  text-decoration: none;
}

/* freccia bella grossa */
.back-btn .arrow {
  font-size: 20px;
  line-height: 1;
}

/* testo un filo più grande */
.back-btn .label {
  font-size: 14px;
}

h1 {
  margin-top: 35px;
}

</style>
</head>

<body>

<a href="javascript:history.back()" class="back-btn">
  <span class="arrow">←</span>
  <span class="label">Torna</span>
</a>


<h1 id="titolo"></h1>

<div id="lista-partite"></div>

<script>
// prende nome squadra da URL
const params = new URLSearchParams(window.location.search);
const team = params.get("team");

document.getElementById("titolo").textContent = team;

// prende tutte le partite dalla pagina principale
fetch("index.html")
  .then(res => res.text())
  .then(html => {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");

    const partite = doc.querySelectorAll('.partita-card');

    const container = document.getElementById("lista-partite");

    partite.forEach(card => {
      const casa = card.dataset.casa;
      const ospite = card.dataset.ospite;

      if (casa === team || ospite === team) {

        const squadre = card.querySelector('.squadre').textContent;
        const orario = card.querySelector('.orario').textContent;
		const giornata = card.querySelector('.partita-giornata')?.textContent || '';
// Colorare il risultato
		const casa = card.dataset.casa;
const ospite = card.dataset.ospite;

const nums = card.querySelectorAll('.risultato-num');

let risultatoHtml = "Risultato: —";

if (nums.length >= 2) {
  const gC = nums[0].textContent.trim();
  const gO = nums[1].textContent.trim();

  const giocata = gC !== '–' && gO !== '–';

  if (giocata) {
    const golCasa = parseInt(gC, 10);
    const golOspite = parseInt(gO, 10);

    let colore = "#ffffff";

    if (team === casa) {
      if (golCasa > golOspite) colore = "#2ecc71";
      else if (golCasa < golOspite) colore = "#e74c3c";
      else colore = "#f5c842";
    } else {
      if (golOspite > golCasa) colore = "#2ecc71";
      else if (golOspite < golCasa) colore = "#e74c3c";
      else colore = "#f5c842";
    }

    risultatoHtml = `<span style="color:${colore}; font-weight:700;">
      Risultato: ${golCasa}-${golOspite}
    </span>`;
  }
}
``

        const div = document.createElement('div');
        div.className = 'partita';
        div.innerHTML = `
		<strong>${orario}</strong> - ${squadre}<br>
		<span style="color: #8a8fa8; font-size: 12px;">${giornata} </span> ${risultatoHtml}
		`;

        container.appendChild(div);
      }
    });

  });
</script>

</body>
</html>
