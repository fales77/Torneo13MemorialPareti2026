<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dettaglio Squadra</title>

<style>
body {
  font-family: Arial;
  background: #0a1628;
  color: white;
  padding: 20px;
}

h1 {
  color: #f5c842;
  font-size: 1.4rem;
  font-weight: bold;
  margin: 0;
}

/* HEADER */
.header-squadra {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 15px;
}

/* BOTTONE BACK */
.back-btn {
  display: flex;
  align-items: center;
  gap: 2px;
  background: #f5c842;
  color: #0a1628;
  padding: 4px 6px;
  border-radius: 6px;
  font-weight: 700;
  text-decoration: none;
  font-size: 0.9rem;
}

.back-btn:hover {
  background: #fde98a;
  color: #0a1628;
}

.back-btn .arrow {
  font-size: 18px;
  line-height: 1;
}

.back-btn .label {
  font-size: 12px;
}

/* PARTITE */
.partita {
  background: rgba(255,255,255,0.05);
  padding: 5px 8px;
  margin: 5px 0;
  border-radius: 6px;
}

/* DATA + ORA */
.match-datetime {
  font-size: 0.8rem;
  color: #999;
  margin: 0;
  padding: 0;
  line-height: 1;        /* 👈 fondamentale */
  transform: translateY(2px);
}

/* STRUTTURA PARTITA */
.match-row {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.match-main {
  margin: 0;
  padding: 0;
  line-height: 1;        /* 👈 fondamentale */
}

/* elimina eventuali spazi tra elementi inline */
.match-row span,
.match-row strong {
  margin: 1;
  padding: 1;
}


</style>
</head>

<body>
<div class="header-squadra">
  <a href="javascript:history.back()" class="back-btn">
    <!--<span class="arrow">←</span>-->
    <span class="label">Back</span>
  </a>

  <h1 id="titolo"></h1>
</div>

<div id="lista-partite"></div>

<script>

// 🔹 prende nome squadra da URL
const params = new URLSearchParams(window.location.search);
const team = params.get("team");

// 🔹 titolo pagina
document.getElementById("titolo").textContent = team;

// ✅ formato data leggibile
function formattaData(d) {
  const giorni = ["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
  const mesi = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno"];
  const date = new Date(d);
  return `${giorni[date.getDay()]} ${date.getDate()} ${mesi[date.getMonth()]}`;
}

// 🔹 carica JSON
fetch('risultatiCOMPLETO.json')
  .then(res => res.json())
  .then(risultati => {

    if (!team) return;

    const container = document.getElementById("lista-partite");
    container.innerHTML = '';

    // 🔹 filtra partite squadra
    const partite = risultati.filter(m =>
      m.casa === team || m.trasferta === team
    );

    // ✅ ordina per data + ora
    partite.sort((a, b) => {
      return new Date(a.data + " " + a.ora) - new Date(b.data + " " + b.ora);
    });

    // 🔹 ciclo partite
    partite.forEach(m => {

      const gC = m.golCasa;
      const gO = m.golTrasferta;

      let risultato = "—";
      let colore = "#ffffff";

      // ✅ PARTITA RINVIATA
      if (m.rinviata === true) {
        risultato = m.label || "RINV.";
        colore = "#ff7675";
      }

      // ✅ PARTITA GIOCATA
      else if (gC !== null && gO !== null) {

        risultato = `${gC}-${gO}`;

        if (m.casa === team) {
          if (gC > gO) colore = "#2ecc71";
          else if (gC < gO) colore = "#e74c3c";
          else colore = "#f5c842";
        } else {
          if (gO > gC) colore = "#2ecc71";
          else if (gO < gC) colore = "#e74c3c";
          else colore = "#f5c842";
        }
      }

      const div = document.createElement('div');
      div.className = 'partita';

      // ✅ evidenzia squadra selezionata
      const casa = m.casa === team
        ? `<span class="team-selected">${m.casa}</span>`
        : m.casa;

      const trasferta = m.trasferta === team
        ? `<span class="team-selected">${m.trasferta}</span>`
        : m.trasferta;

      // ✅ aggiunge classe se rinviata (opzionale)
      const classeExtra = m.rinviata ? "match-rinvio" : "";

      div.innerHTML = `
        <div class="match-row">

          <span class="match-datetime">
            📅 ${formattaData(m.data)} | 🕒 ${m.ora} | ${m.giornata}ª GIORNATA
          </span>

          <span class="match-main">
            <strong>${casa} vs ${trasferta}</strong> :
            <span class="${classeExtra}" style="color:${colore}; font-weight:700;">
              ${risultato}
            </span>
          </span>

        </div>
      `;

      container.appendChild(div);
    });

  })
  .catch(err => console.error("Errore:", err));

</script>



</body>
</html>
