<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dettaglio Squadra</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">

<style>
body {
  font-family: Arial;
  background: #0a1628;
  color: white;
  padding: 20px;
}

  /* LAYOUT */
.container {
  max-width: 500px;
  margin: 0 auto;
}

h1 {
  color: #f5c842;
  font-size: 1.4rem;
  font-weight: bold;
  margin: 0;
}

/* HEADER */
.header-squadra {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 15px;
}

/* BOTTONE BACK */
.back-btn {
  display: flex;
  align-items: center;
  gap: 2px;
  background: #f5c842;
  color: #0a1628;
  padding: 4px 6px;
  border-radius: 6px;
  font-weight: 700;
  text-decoration: none;
  font-size: 0.9rem;
}
.back-btn:hover {
  background: #fde98a;
  color: #0a1628;
}
.back-btn .label {
  font-size: 12px;
}

/* PARTITE CALENDARIO */
.partita {
  background: rgba(255,255,255,0.05);
  padding: 5px 8px;
  margin: 5px 0;
  border-radius: 6px;
}

.match-datetime {
  font-size: 0.8rem;
  color: #999;
  margin: 0;
  padding: 0;
  line-height: 1;
  transform: translateY(2px);
}

.match-row {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.match-main {
  margin: 0;
  padding: 0;
  line-height: 1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.match-main .teams {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.match-main .result {
  font-weight: 700;
  min-width: 40px;
  text-align: right;
  flex-shrink: 0;
}

/* SEZIONE TITOLO */
.sezione-titolo {
  font-size: 1rem;
  font-weight: 700;
  color: #f5c842;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 20px 0 8px 0;
  padding-bottom: 4px;
  border-bottom: 2px solid #f5c842;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* PARTITE FINALI — stesso riquadro del girone */
.partita-finale {
  background: rgba(255,255,255,0.05);
  padding: 5px 8px;
  margin: 5px 0;
  border-radius: 6px;
}

/* gap ridotto solo nelle card finali */
.partita-finale .match-row {
  gap: 1px;
}

/* riga 1: badge fase + data + ora */
.finale-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.8rem;
  color: #999;
  line-height: 1;
  margin-bottom: 5px;
}

/* badge colorato per fase */
.fase-badge {
  display: inline-block;
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 1px 6px;
  border-radius: 4px;
  background: #f5c842;
  color: #0a1628;
  flex-shrink: 0;
  line-height: 1.6;
}
.fase-badge.ottavi     { background: #3b82f6; color: #fff; }
.fase-badge.quarti     { background: #8b5cf6; color: #fff; }
.fase-badge.semifinali { background: #f97316; color: #fff; }
.fase-badge.finale     { background: #f5c842; color: #0a1628; }
.fase-badge.terzo      { background: #6b7280; color: #fff; }

.vs-sep {
  color: #888;
  font-style: italic;
  font-size: 0.85rem;
  margin: 0 3px;
}

.team-selected {
  color: #f5c842;
}

.nessuna-finale {
  font-size: 0.85rem;
  color: #666;
  padding: 8px 0;
  font-style: italic;
}

</style>
</head>

<body>
<div class="container">
<div class="header-squadra">
  <a href="javascript:history.back()" class="back-btn">
    <span class="label">Back</span>
  </a>
  <h1 id="titolo"></h1>
</div>

<!-- CALENDARIO -->
<div class="sezione-titolo">📅 Fase Calendario</div>
<div id="lista-partite"></div>

<!-- FASI FINALI -->
<div class="sezione-titolo">🎯 Fase Finali</div>
<div id="lista-finali"></div>

<script>

// 🔹 nome squadra da URL
const params = new URLSearchParams(window.location.search);
const team = params.get("team");
document.getElementById("titolo").textContent = team;

// ✅ formato data leggibile
function formattaData(d) {
  const giorni = ["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
  const mesi = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno"];
  const date = new Date(d);
  return `${giorni[date.getDay()]} ${date.getDate()} ${mesi[date.getMonth()]}`;
}

// ✅ colore risultato (V/P/X) dal punto di vista della squadra
function coloreRisultato(gC, gO, ruolo) {
  if (ruolo === 'casa') {
    if (gC > gO) return "#2ecc71";
    if (gC < gO) return "#e74c3c";
    return "#f5c842";
  } else {
    if (gO > gC) return "#2ecc71";
    if (gO < gC) return "#e74c3c";
    return "#f5c842";
  }
}

// ✅ classe CSS per badge fase
function classeBadge(fase) {
  const f = fase.toLowerCase();
  if (f.includes("ottav"))  return "ottavi";
  if (f.includes("quart"))  return "quarti";
  if (f.includes("semif"))  return "semifinali";
  if (f.includes("3") || f.includes("terzo") || f.includes("bronzo")) return "terzo";
  if (f.includes("final"))  return "finale";
  return "";
}

// ══════════════════════════════════════════
// 1️⃣  CARICA CALENDARIO (risultatiCOMPLETO.json)
// ══════════════════════════════════════════
fetch('risultatiCOMPLETO.json')
  .then(res => res.json())
  .then(risultati => {
    if (!team) return;

    const container = document.getElementById("lista-partite");
    container.innerHTML = '';

    const partite = risultati
      .filter(m => m.casa === team || m.trasferta === team)
      .sort((a, b) => new Date(a.data + " " + a.ora) - new Date(b.data + " " + b.ora));

    if (partite.length === 0) {
      container.innerHTML = '<p class="nessuna-finale">Nessuna partita trovata.</p>';
      return;
    }

    partite.forEach(m => {
      const gC = m.golCasa;
      const gO = m.golTrasferta;

      let risultato = "—";
      let colore = "#ffffff";

      if (m.rinviata === true) {
        risultato = m.label || "RINV.";
        colore = "#ff7675";
      } else if (gC !== null && gO !== null) {
        risultato = `${gC}-${gO}`;
        const ruolo = m.casa === team ? 'casa' : 'trasferta';
        colore = coloreRisultato(gC, gO, ruolo);
      }

      const casa = m.casa === team
        ? `<span class="team-selected">${m.casa}</span>`
        : m.casa;
      const trasferta = m.trasferta === team
        ? `<span class="team-selected">${m.trasferta}</span>`
        : m.trasferta;

      const classeExtra = m.rinviata ? "match-rinvio" : "";

      const div = document.createElement('div');
      div.className = 'partita';
      div.innerHTML = `
        <div class="match-row">
          <span class="match-datetime">
            📅 ${formattaData(m.data)} | 🕒 ${m.ora} | ${m.giornata}ª GIORNATA
          </span>
		  <div class="match-main">
			<strong class="teams">${casa} - ${trasferta} :</strong>
			<span class="result" style="color:${colore};">
			${risultato}
			</span>
		  </div>

        </div>
      `;
      container.appendChild(div);
    });
  })
  .catch(err => console.error("Errore calendario:", err));


// ══════════════════════════════════════════
// 2️⃣ CARICA FASI FINALI (finali.json)
// ══════════════════════════════════════════
fetch('finali.json')
  .then(res => res.json())
  .then(finali => {
    if (!team) return;

    const container = document.getElementById("lista-finali");
    container.innerHTML = '';

    // filtra solo le partite in cui compare la squadra
    const partite = finali
      .filter(m => m.casa === team || m.trasferta === team)
      .sort((a, b) => new Date(a.data + " " + a.ora) - new Date(b.data + " " + b.ora));

    if (partite.length === 0) {
      container.innerHTML = '<p class="nessuna-finale">Nessuna partita nella fase finale.</p>';
      return;
    }

    partite.forEach(m => {
      const gC = m.golCasa;
      const gO = m.golTrasferta;

      let risultatoTesto = "—";
      let colore = "#ffffff";

      if (gC !== null && gO !== null) {
        risultatoTesto = `${gC}-${gO}`;
        const ruolo = m.casa === team ? 'casa' : 'trasferta';
        colore = coloreRisultato(gC, gO, ruolo);
      }

      const casa = m.casa === team
        ? `<span class="team-selected">${m.casa}</span>`
        : m.casa;
      const trasferta = m.trasferta === team
        ? `<span class="team-selected">${m.trasferta}</span>`
        : m.trasferta;

      const badgeClass = classeBadge(m.fase);

      const div = document.createElement('div');
      div.className = 'partita-finale';
      div.innerHTML = `
        <div class="match-row">
          <div class="finale-meta">
            <span class="fase-badge ${badgeClass}">${m.fase}</span>
            <span>📅 ${formattaData(m.data)} | 🕒 ${m.ora}</span>
          </div>
          <span class="match-main">
            <strong>${casa} - ${trasferta} :</strong>
            <span style="color:${colore}; font-weight:700;">${risultatoTesto}</span>
          </span>
        </div>
      `;
      container.appendChild(div);
    });
  })
  .catch(err => {
    // finali.json non ancora disponibile o errore
    const container = document.getElementById("lista-finali");
    container.innerHTML = '<p class="nessuna-finale">Dati fasi finali non ancora disponibili.</p>';
    console.warn("finali.json:", err);
  });

</script>
</div>
</body>
</html>
