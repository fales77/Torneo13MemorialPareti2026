<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dettaglio Squadra</title>

<style>
body {
  font-family: Arial;
  background: #0a1628;
  color: white;
  padding: 20px;
}

h1 {
  color: #f5c842;
}

.partita {
  background: rgba(255,255,255,0.05);
  padding: 10px;
  margin: 6px 0;
  border-radius: 6px;
}
/*FRECCIA INDIETRO - TORNA A*/
.back-btn {
  position: fixed;
  top: 15px;
  left: 15px;

  display: flex;
  align-items: center;
  gap: 6px;

  background: #f5c842;
  color: #0a1628;

  padding: 6px 10px;        /* 👈 più compatto */
  border-radius: 6px;

  font-weight: 700;
  text-decoration: none;

  z-index: 1000;
}

/* hover fix (importantissimo) */
.back-btn:hover {
  background: #fde98a;
  color: #0a1628;
  text-decoration: none;
}

/* freccia bella grossa */
.back-btn .arrow {
  font-size: 10px;
  line-height: 1;
}

/* testo un filo più grande */
.back-btn .label {
  font-size: 14px;
}

h1 {
  margin-top: 35px;
}
.match-card {
  padding: 10px;
  border-bottom: 1px solid #ccc;
}

.info {
  font-size: 0.85rem;
  color: gray;
  display: flex;
  gap: 15px;
}
.match-datetime {
  font-size: 0.75rem;
  color: #888;
  display: block;
  margin-bottom: 1px;
}

</style>
</head>

<body>

<a href="javascript:history.back()" class="back-btn">
  <span class="arrow">←</span>
  <span class="label">Torna</span>
</a>


<h1 id="titolo"></h1>

<div id="lista-partite"></div>

<script>
// 🔹 prende nome squadra da URL
const params = new URLSearchParams(window.location.search);
const team = params.get("team");

// 🔹 titolo pagina
document.getElementById("titolo").textContent = team;

// 🔹 carica anche index.html (calendario)
Promise.all([
  fetch('risultati.json').then(r => r.json()),
  fetch('index.html').then(r => r.text())
])
.then(([risultati, htmlCalendario]) => {

  if (!team) return;

  const parser = new DOMParser();
  const doc = parser.parseFromString(htmlCalendario, "text/html");

  // 🔹 funzione per trovare data e orario
  function trovaInfoPartita(casa, trasferta) {

    const giorni = doc.querySelectorAll(".giorno-block");

    for (let giorno of giorni) {
      const data = giorno.querySelector(".giorno-header")?.innerText;
      const matches = giorno.querySelectorAll(".partita-card");

      for (let match of matches) {
        const c = match.dataset.casa;
        const o = match.dataset.ospite;
        const orario = match.querySelector(".orario")?.innerText;

        if (c === casa && o === trasferta) {
          return { data, orario };
        }
      }
    }

    return { data: "Data da definire", orario: "—" };
  }

  const container = document.getElementById("lista-partite");
  container.innerHTML = '';

  // 🔹 filtra partite della squadra
  const partite = risultati.filter(m =>
    m.casa === team || m.trasferta === team
  );

  // 🔹 ciclo partite
  partite.forEach(m => {

    const info = trovaInfoPartita(m.casa, m.trasferta);

    const gC = m.golCasa;
    const gO = m.golTrasferta;

    let risultato = "—";

    if (gC !== null && gO !== null) {
      risultato = `${gC}-${gO}`;
    }

    // 🔹 colore risultato
    let colore = "#ffffff";

    if (gC !== null && gO !== null) {
      if (team === m.casa) {
        if (gC > gO) colore = "#2ecc71";
        else if (gC < gO) colore = "#e74c3c";
        else colore = "#f5c842";
      } else {
        if (gO > gC) colore = "#2ecc71";
        else if (gO < gC) colore = "#e74c3c";
        else colore = "#f5c842";
      }
    }

    // ✅ FORMATO COME VUOI TU
    const div = document.createElement('div');
    div.className = 'partita';

    div.innerHTML = `
      
<span class="match-datetime">
  📅 ${info.data} | 🕒 ${info.orario}
</span><br>

      <strong>${m.casa} vs ${m.trasferta}</strong> : 
      <span style="color:${colore}; font-weight:700;">
        ${risultato}
      </span>
    `;

    container.appendChild(div);
  });

})
.catch(err => console.error("Errore:", err));
</script>

</body>
</html>
